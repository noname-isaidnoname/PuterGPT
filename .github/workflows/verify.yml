name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LIGHTPANDA_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright outside the repository
        run: npm install --global playwright
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file" || exit 1; done
      - name: Verify in Chromium
        run: node tools/verify-all.js --backend playwright
